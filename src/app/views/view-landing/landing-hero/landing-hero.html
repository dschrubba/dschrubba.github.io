<section id="top" class="hero" aria-labelledby="hero-title">
  <img
    class="hero-bg"
    [src]="media.background"
    [attr.srcset]="media.backgroundSrcset"
    sizes="100vw"
    alt=""
    fetchpriority="high"
  />
  <div class="pf-container hero-section">
    <div class="hero-copy">
      @if (content(); as c) {
        <h1 id="hero-title" class="hero-title">
          {{ c.greeting }}<br />
          <span class="pf-muted">{{ c.tagline }}</span>
        </h1>
        <p class="hero-intro" [innerHTML]="c.intro"></p>
        <div class="hero-actions">
          <a class="pf-button is-accent" href="#work">
            {{ c.ctaWork }}
            <svg lucideArrowDown aria-hidden="true"></svg>
          </a>
          <a class="pf-button is-outline" [href]="githubUrl">
            <app-github-icon></app-github-icon>
            {{ c.ctaGithub }}
          </a>
        </div>
      }
    </div>

    <figure class="photo">
      @if (media.photo) {
        <img [src]="media.photo" [alt]="content()?.photoAlt ?? ''" width="880" height="1174" />
      }
    </figure>
  </div>
</section>
