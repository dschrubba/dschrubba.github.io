<section id="contact" class="contact" aria-labelledby="contact-title">
  @if (content(); as c) {
    <div class="panel">
      <div class="copy">
        <span class="pf-label">{{ c.label }}</span>
        <h2 id="contact-title" class="pf-section-title">{{ c.title }}</h2>
        <p class="pf-muted">{{ c.text }}</p>
      </div>
      <a class="pf-button is-accent cta" [href]="githubUrl">
        <app-github-icon></app-github-icon>
        {{ c.cta }}
      </a>
    </div>
  }
</section>
