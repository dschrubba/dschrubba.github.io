<section id="contact" class="contact" aria-labelledby="contact-title">

    <div class="copy">
      <span class="pf-label">/contact</span>
      <h2 id="contact-title" class="pf-section-title">
        Have an old game, an odd file format or a site to build?
      </h2>
      <p class="pf-muted">
        The fastest way to reach me is through GitHub — open an issue or start a discussion.
      </p>
    </div>
    <a class="pf-button is-accent cta" [href]="githubUrl">
      <app-github-icon></app-github-icon>
      github.com/dschrubba
    </a>
  </div>
</section>
