<section class="pf-section focus" [attr.aria-label]="content()?.label">
  @if (content(); as c) {
    <div class="focus-grid">
      @for (area of c.items; track $index) {
        <app-skill-grid-cell
          [index]="$index + 1"
          [title]="area.title"
          [text]="area.text"
          [image]="area.image ?? ''"
        ></app-skill-grid-cell>
      }
    </div>
  }
</section>
