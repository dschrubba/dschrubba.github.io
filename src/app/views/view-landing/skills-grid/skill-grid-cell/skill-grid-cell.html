@if (image()) {
  <div class="cell-media">
    <img [src]="image()" alt="" loading="lazy" width="1280" height="720" />
  </div>
}
<div class="cell-body">
  <span class="cell-number pf-mono">{{ number() }}</span>
  <h3 class="cell-title">{{ title() }}</h3>
  <p class="cell-text">{{ text() }}</p>
</div>
