@let p = project();
<article class="card-inner">
  <div class="media">
    @if (p.image) {
      <img [src]="p.image" [alt]="p.imageAlt ?? ''" loading="lazy" />
    } @else {
      <span class="pf-mono placeholder">{{ p.placeholder }}</span>
    }
  </div>
  <div class="body">
    <span class="category pf-mono">{{ p.category }}</span>
    <h3 class="title">
      @if (p.link) {
        <a [href]="p.link">{{ p.title }}</a>
      } @else {
        {{ p.title }}
      }
    </h3>
    <p class="text">{{ p.text }}</p>
    <ul class="pf-chips" aria-label="Technologies">
      @for (tag of p.tags; track tag) {
        <li>{{ tag }}</li>
      }
    </ul>
  </div>
</article>
