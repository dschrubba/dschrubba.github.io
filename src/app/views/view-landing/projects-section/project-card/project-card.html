@let p = project();
@let m = media();
<article class="card-inner">
  <div class="media">
    @if (p.image) {
      <img [src]="p.image" [alt]="p.title" loading="lazy" width="1280" height="720" />
    } @else {
      <span class="pf-mono placeholder">{{ p.placeholder }}</span>
    }
  </div>
  <div class="body">
    <span class="category pf-mono">{{ p.category }}</span>
    <h3 class="title">
      @if (m.link) {
        <a [href]="m.link">{{ p.title }}</a>
      } @else {
        {{ p.title }}
      }
    </h3>
    <p class="text">{{ p.text }}</p>
    <ul class="pf-chips" [attr.aria-label]="tagsLabel()">
      @for (tag of p.tags; track $index) {
        <li>{{ tag }}</li>
      }
    </ul>
  </div>
</article>
