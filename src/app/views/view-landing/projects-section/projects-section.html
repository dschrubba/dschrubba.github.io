<section id="work" class="pf-section projects" aria-labelledby="work-title">
  @if (content(); as c) {
    <div class="projects-head">
      <div class="pf-heading">
        <span class="pf-label">{{ c.label }}</span>
        <h2 id="work-title" class="pf-section-title">{{ c.title }}</h2>
      </div>
      <a class="pf-mono all-link" [href]="githubUrl">{{ c.allRepos }}</a>
    </div>
    <div class="projects-grid">
      @for (project of c.items; track project.id) {
        <app-project-card [project]="project" [tagsLabel]="c.tagsLabel"></app-project-card>
      }
    </div>
  }
</section>
