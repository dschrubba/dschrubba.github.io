<header class="site-header">
  <nav class="pf-container site-nav" aria-label="Primary">
    <a class="brand" href="#top">
      <span class="brand-mark"><svg lucideBraces aria-hidden="true"></svg></span>
      {{ title() }}
    </a>
    <ul class="nav-links pf-mono">
      @for (link of links; track link.fragment) {
        <li><a [href]="'#' + link.fragment">{{ link.label }}</a></li>
      }
    </ul>
  </nav>
</header>
